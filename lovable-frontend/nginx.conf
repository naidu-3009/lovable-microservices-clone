server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Keep the HTML shell fresh so newly deployed hashed JS/CSS bundles are picked up.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # Vite production assets are content-hashed and can be cached safely.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # React Router routes (including /pricing, /billing, /success.html and /cancel.html).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
