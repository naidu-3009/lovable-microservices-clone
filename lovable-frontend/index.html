<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link
            href="/ideastitch-icon.png?v=3"
            rel="icon"
            sizes="512x512"
            type="image/png"
    />
    <link
            href="/ideastitch-icon.png?v=3"
            rel="apple-touch-icon"
    />
    <meta content="IdeaStitch" name="application-name"/>
    <meta content="#cbd0d2" name="theme-color"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
          rel="stylesheet"/>
    <script>
        try {
          var savedTheme = localStorage.getItem("ideastitch.theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var initialTheme = savedTheme === "light" || savedTheme === "dark" ? savedTheme : (systemDark ? "dark" : "light");
          document.documentElement.classList.toggle("dark", initialTheme === "dark");
          document.documentElement.dataset.theme = initialTheme;
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute("content", initialTheme === "dark" ? "#20272b" : "#cbd0d2");
        } catch (_) {}
    </script>
    <title>IdeaStitch — Ideas, made tangible</title>
    <meta content="IdeaStitch helps turn a clear application brief into a working interface with code, preview, and iteration in one workspace."
          name="description"/>
    <meta content="IdeaStitch" name="author"/>
    <meta content="IdeaStitch — Weave Ideas Into Reality" property="og:title"/>
    <meta content="Turn an application idea into a working interface with IdeaStitch." property="og:description"/>
    <meta content="website" property="og:type"/>
    <meta content="https://ideastitch.in/ideastitch-icon.png" property="og:image"/>

    <meta content="summary_large_image" name="twitter:card"/>
    <meta content="https://ideastitch.in/ideastitch-icon.png" name="twitter:image"/>
</head>

<body>
<div id="root"></div>
<script src="/src/main.tsx" type="module"></script>
</body>
</html>
