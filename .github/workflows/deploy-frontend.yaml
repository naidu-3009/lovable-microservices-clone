name: Deploy IdeaStitch Frontend to GKE

on:
  push:
    branches:
      - master
    paths:
      - 'lovable-frontend/**'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ideastitch-frontend-production
  cancel-in-progress: true

env:
  IMAGE_REPOSITORY: docker.io/nishanthtalari/lovable-frontend
  NAMESPACE: lovable-core
  DEPLOYMENT_NAME: lovable-frontend
  CONTAINER_NAME: lovable-frontend

jobs:
  build-push-deploy:
    name: Build, Push, and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./lovable-frontend
          file: ./lovable-frontend/Dockerfile
          platforms: linux/amd64
          push: true

          # This tag is used to publish the image.
          # GKE will deploy the digest returned by this step.
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}

          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ secrets.GCP_CLUSTER }}
          location: ${{ secrets.GCP_ZONE }}

      - name: Deploy Exact SHA-256 Image and Force New Pod
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image digest: $IMAGE_DIGEST"
            exit 1
          fi

          IMAGE_REF="${IMAGE_REPOSITORY}@${IMAGE_DIGEST}"

          echo "Commit: ${GITHUB_SHA}"
          echo "Deploying immutable image: ${IMAGE_REF}"

          # Confirm the target Deployment exists before modifying it.
          kubectl get deployment "$DEPLOYMENT_NAME" \
            --namespace "$NAMESPACE"

          # Update the image and pod-template annotation atomically.
          # The commit annotation forces a new rollout for every push,
          # even if two builds happen to produce the same image digest.
          PATCH="$(jq -n \
            --arg image "$IMAGE_REF" \
            --arg commit "$GITHUB_SHA" \
            '{
              spec: {
                template: {
                  metadata: {
                    annotations: {
                      "ci.ideastitch.in/commit-sha": $commit
                    }
                  },
                  spec: {
                    containers: [
                      {
                        name: "lovable-frontend",
                        image: $image,
                        imagePullPolicy: "Always"
                      }
                    ]
                  }
                }
              }
            }'
          )"

          kubectl patch deployment "$DEPLOYMENT_NAME" \
            --namespace "$NAMESPACE" \
            --type strategic \
            --patch "$PATCH"

          echo "EXPECTED_IMAGE=${IMAGE_REF}" >> "$GITHUB_ENV"

      - name: Wait for Complete Rollout
        shell: bash
        run: |
          set -euo pipefail

          kubectl rollout status \
            "deployment/${DEPLOYMENT_NAME}" \
            --namespace "$NAMESPACE" \
            --timeout=300s

      - name: Verify Running Pod Uses Exact Digest
        shell: bash
        run: |
          set -euo pipefail

          POD_NAME="$(kubectl get pods \
            --namespace "$NAMESPACE" \
            --selector="app=lovable-frontend" \
            --field-selector=status.phase=Running \
            --output=jsonpath='{.items[0].metadata.name}')"

          if [[ -z "$POD_NAME" ]]; then
            echo "No running frontend pod was found."
            kubectl get pods --namespace "$NAMESPACE"
            exit 1
          fi

          POD_IMAGE="$(kubectl get pod "$POD_NAME" \
            --namespace "$NAMESPACE" \
            --output=jsonpath='{.spec.containers[?(@.name=="lovable-frontend")].image}')"

          echo "Pod: $POD_NAME"
          echo "Actual image reference: $POD_IMAGE"
          echo "Expected image reference: $EXPECTED_IMAGE"

          if [[ "$POD_IMAGE" != "$EXPECTED_IMAGE" ]]; then
            echo "ERROR: Pod is not configured with the expected image digest."
            exit 1
          fi

      - name: Smoke-Test Frontend Inside Pod
        shell: bash
        run: |
          set -euo pipefail

          kubectl exec "deployment/${DEPLOYMENT_NAME}" \
            --namespace "$NAMESPACE" \
            --container "$CONTAINER_NAME" \
            -- sh -ec \
            'wget -q -O - http://127.0.0.1/ | grep -q "IdeaStitch"'

          echo "Frontend NGINX is serving the IdeaStitch application."

      - name: Smoke-Test Public Website
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error --location \
            --retry 8 \
            --retry-delay 5 \
            --retry-all-errors \
            http://ideastitch.in/ \
            --output /tmp/ideastitch.html

          grep -q "IdeaStitch" /tmp/ideastitch.html

          echo "Public website is responding with the IdeaStitch page."
