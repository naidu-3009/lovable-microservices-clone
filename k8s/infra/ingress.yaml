apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lovable-main-ingress
  namespace: lovable-core
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ideastitch.in
        - www.ideastitch.in
        - api.ideastitch.in
      secretName: ideastitch-tls
  rules:
    - host: ideastitch.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lovable-frontend
                port:
                  number: 80
    - host: www.ideastitch.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lovable-frontend
                port:
                  number: 80
    - host: "*.previews.ideastitch.in"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: lovable-micro-proxy
                port:
                  number: 80
    - host: api.ideastitch.in
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gtw
                port:
                  number: 80